<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM - Project Management MVP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                         'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica',
                         'Arial', sans-serif;
            background: linear-gradient(135deg, #032147 0%, #209dd7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #032147;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #032147;
        }
        
        p {
            font-size: 1.1em;
            color: #888888;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .status {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            flex-direction: column;
        }
        
        .status-item {
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .status-success {
            background-color: #ecad0a20;
            color: #ecad0a;
            border: 1px solid #ecad0a;
        }
        
        .accent {
            color: #209dd7;
            font-weight: 600;
        }
        
        .api-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #753991;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        
        .api-link:hover {
            background-color: #032147;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 PM Backend</h1>
        <p>Project Management MVP</p>
        
        <div class="status">
            <div class="status-item status-success">
                ✓ Backend is running
            </div>
            <div class="status-item status-success">
                ✓ Static HTML served successfully
            </div>
            <div class="status-item status-success">
                ✓ Ready for integration
            </div>
        </div>
        
        <p style="margin-top: 40px; font-size: 0.95em;">
            API endpoint available at <span class="accent">/api/test</span>
        </p>
        
        <a href="/api/test" class="api-link">Test API →</a>
    </div>
</body>
</html>
