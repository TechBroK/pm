version: "3.8"

services:
  pm:
    build: .
    container_name: pm-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override with compose-specific settings if needed
      - ENVIRONMENT=development
    restart: unless-stopped
    volumes:
      # Persist database between restarts
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
